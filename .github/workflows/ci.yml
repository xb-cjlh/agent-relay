name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: relay-ci-fixture-password
          MYSQL_ROOT_HOST: "%"
        ports:
          - 13306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prelay-ci-fixture-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and verify Go and Java
        run: |
          make build
          go test -race ./...
          go vet ./...
          for script in relayctl/static/*.js; do node --check "$script"; done
      - name: Configure isolated MySQL tests
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
          mkdir -p .local
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.local/mysql-test.json')
          path.write_text(json.dumps({'host':'127.0.0.1','port':13306,'user':'root','password':'relay-ci-fixture-password'}))
          path.chmod(0o600)
          PY
      - name: HTTP and installation integration tests
        run: python -m unittest discover -s tests -v
      - name: Browser regressions
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium webkit
          python tests/auth_loading_smoke.py
          python tests/session_list_smoke.py
          python tests/session_pagination_smoke.py
          python tests/account_images_smoke.py
          python tests/permissions_smoke.py
          python tests/markdown_smoke.py
