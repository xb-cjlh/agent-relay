spring.application.name=relay-server
server.address=${RELAY_HOST:127.0.0.1}
server.port=${RELAY_PORT:8765}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5s
spring.main.banner-mode=off
spring.mvc.log-resolved-exception=false
spring.web.resources.cache.cachecontrol.no-store=true
relay.data=${RELAY_DATA:data}
relay.downloads=${RELAY_DOWNLOADS:./dist/downloads}
spring.jackson.deserialization.fail-on-trailing-tokens=true
server.tomcat.connection-timeout=20s
spring.datasource.url=${RELAY_DB_URL:jdbc:mysql://127.0.0.1:13306/relay?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&connectTimeout=5000&socketTimeout=20000}
spring.datasource.username=${RELAY_DB_USERNAME:relay}
spring.datasource.password=${RELAY_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.max-lifetime=600000
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
relay.oss.endpoint=${RELAY_OSS_ENDPOINT:}
relay.oss.upload-endpoint=${RELAY_OSS_UPLOAD_ENDPOINT:${relay.oss.endpoint}}
relay.oss.region=${RELAY_OSS_REGION:cn-hangzhou}
relay.oss.bucket=${RELAY_OSS_BUCKET:}
relay.oss.access-key-id=${RELAY_OSS_ACCESS_KEY_ID:}
relay.oss.access-key-secret=${RELAY_OSS_ACCESS_KEY_SECRET:}
relay.oss.security-token=${RELAY_OSS_SECURITY_TOKEN:}
relay.oss.prefix=${RELAY_OSS_PREFIX:relay-dev/}
